<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let's Be Social 2027</title>
<style>
  :root {
    --bg:#f6f5f2; --card:#ffffff; --text:#1f2328; --muted:#6b7280; --line:#e5e3dd;
    --accent:#2a9d8f; --away:#c0392b; --town:#3498db; --keen:#27ae60;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181a; --card:#202326; --text:#eceff1; --muted:#9aa3ab; --line:#33383d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--text); line-height:1.4; }
  .hidden { display:none !important; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  h1 { font-size:1.3rem; margin:0; }
  h2 { font-size:1.05rem; margin:0 0 10px; }
  button, input, select { font: inherit; color: inherit; }
  input, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  label { display:block; font-size:.8rem; color:var(--muted); margin:10px 0 4px; }
  .btn { background:var(--accent); color:#fff; border:0; padding:10px 16px; border-radius:10px; cursor:pointer; font-weight:600; }
  .btn:disabled { opacity:.6; cursor:default; }
  .btn.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:500; padding:6px 10px; }
  .btn.small { padding:4px 8px; font-size:.8rem; }
  .error { color: var(--away); font-size:.9rem; min-height:1.2em; margin-top:8px; }

  /* Login */
  #login { max-width:360px; margin: 18vh auto 0; text-align:center; }
  #login input { text-align:center; font-size:1.4rem; letter-spacing:.3em; margin:14px 0; }

  /* Header */
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .me { display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--muted); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; flex:none; }

  /* Calendar */
  .monthbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .monthbar .btn { padding:6px 14px; }
  .grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
  .dow { text-align:center; font-size:.7rem; color:var(--muted); padding-bottom:2px; }
  .day { min-height:58px; padding:4px; border:1px solid var(--line); border-radius:8px; background:var(--bg);
         text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
  .day.empty { visibility:hidden; }
  .day.weekend { background: color-mix(in srgb, var(--accent) 8%, var(--bg)); }
  .day.today { border-color: var(--accent); }
  .day.selected { outline:2px solid var(--accent); }
  .day .n { font-size:.8rem; font-weight:600; }
  .day .counts { display:flex; flex-wrap:wrap; gap:1px 4px; font-size:.65rem; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.8rem; color:var(--muted); margin-top:10px; }

  /* Chips and lists */
  .chip { display:inline-flex; align-items:center; gap:5px; background:var(--bg); border:1px solid var(--line);
          border-radius:99px; padding:2px 9px 2px 7px; font-size:.82rem; margin:2px 4px 2px 0; }
  .group { margin-bottom:12px; }
  .group h3 { font-size:.85rem; margin:0 0 4px; }
  .entry { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line); font-size:.9rem; }
  .entry:first-of-type { border-top:0; }
  .entry .meta { color:var(--muted); font-size:.8rem; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .weekend-row { display:block; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line);
                 padding:10px 0; cursor:pointer; }
  .weekend-row:first-of-type { border-top:0; }
  .weekend-row .when { font-weight:600; font-size:.9rem; }
  .muted { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="card hidden">
  <h1>Let's Be Social 2027</h1>
  <p class="muted">Enter your personal PIN</p>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
  <button id="loginBtn" class="btn" style="width:100%">Let me in</button>
  <div id="loginError" class="error"></div>
</div>

<!-- LOADING -->
<div id="loading" class="wrap"><p class="muted" style="text-align:center;margin-top:30vh">Loading…</p></div>

<!-- APP -->
<div id="app" class="wrap hidden">
  <div class="topbar">
    <h1>Let's Be Social 2027</h1>
    <div class="me"><span class="dot" id="meDot"></span><span id="meName"></span>
      <button id="logoutBtn" class="btn ghost">Log out</button></div>
  </div>

  <div class="card">
    <div class="monthbar">
      <button id="prevBtn" class="btn">‹</button>
      <h2 id="monthTitle" style="margin:0"></h2>
      <button id="nextBtn" class="btn">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span>✈️ Away</span><span>🏠 In town</span><span>🎉 Free &amp; keen</span>
      <span>(numbers = how many friends)</span>
    </div>
  </div>

  <div class="card">
    <h2 id="dayTitle"></h2>
    <div id="dayBody"></div>
  </div>

  <div class="card">
    <h2>Add my availability</h2>
    <label for="fStatus">Status</label>
    <select id="fStatus">
      <option value="away">✈️ Away / Traveling</option>
      <option value="in_town">🏠 In town / Available</option>
      <option value="keen">🎉 Free &amp; keen to hang out</option>
    </select>
    <div class="row2">
      <div><label for="fStart">From</label><input id="fStart" type="date" min="2027-01-01" max="2027-12-31"></div>
      <div><label for="fEnd">To (optional)</label><input id="fEnd" type="date" min="2027-01-01" max="2027-12-31"></div>
    </div>
    <label for="fNote">Note (optional)</label>
    <input id="fNote" type="text" maxlength="200" placeholder="e.g. Portugal with family">
    <div style="margin-top:12px"><button id="addBtn" class="btn">Save</button></div>
    <div id="formError" class="error"></div>
  </div>

  <div class="card">
    <h2>Upcoming weekends</h2>
    <div id="weekends"></div>
  </div>
</div>

<script>
// ====== SETTINGS ======
const API_URL = 'https://script.google.com/macros/s/AKfycbw94VJQp_gXpADIyab3i_YPGlr9p-Dyj5_uHa_7ZAqJFr9dWRFbVMjrP-Do5Fziv0eV/exec';
const YEAR = 2027;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const STATUS = {
  away:    { label: 'Away / Traveling',         icon: '✈️' },
  in_town: { label: 'In town / Available',      icon: '🏠' },
  keen:    { label: 'Free & keen to hang out',  icon: '🎉' }
};

// ====== STATE ======
let pin = localStorage.getItem('f27_pin') || '';
let me = null, data = null, month = 0, selected = null;

// ====== SMALL HELPERS ======
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);
const parse = ds => { const p = ds.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const fmt = (ds, opts) => parse(ds).toLocaleDateString('en-GB', opts);
const colorOf = c => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#888888';
const userById = id => data.users.find(u => u.id === id) || { name: 'Someone', color: '#888888' };
const chip = u => '<span class="chip"><span class="dot" style="background:' + colorOf(u.color) + '"></span>' + esc(u.name) + '</span>';

async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, pin: pin }, payload || {}))
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}

// ====== LOGIN / STARTUP ======
function show(which) {
  ['login', 'loading', 'app'].forEach(id => $(id).classList.toggle('hidden', id !== which));
}

async function start() {
  if (!pin) { show('login'); return; }
  show('loading');
  try {
    const j = await api('getAll');
    enterApp(j);
  } catch (err) {
    if (err.message === 'Wrong PIN') { localStorage.removeItem('f27_pin'); pin = ''; }
    show('login');
    $('loginError').textContent = err.message === 'Wrong PIN' ? '' : 'Could not load: ' + err.message;
  }
}

function enterApp(j) {
  me = j.user; data = j.data;
  $('meName').textContent = me.name;
  $('meDot').style.background = colorOf(me.color);
  const now = new Date();
  if (now.getFullYear() === YEAR) { month = now.getMonth(); selected = ymd(YEAR, month, now.getDate()); }
  else { month = 0; selected = YEAR + '-01-01'; }
  $('fStart').value = selected;
  show('app');
  renderAll();
}

$('loginBtn').onclick = async function () {
  const p = $('pinInput').value.trim();
  if (!p) return;
  $('loginBtn').disabled = true; $('loginError').textContent = '';
  pin = p;
  try {
    const j = await api('getAll');
    localStorage.setItem('f27_pin', p);
    $('pinInput').value = '';
    enterApp(j);
  } catch (err) {
    pin = '';
    $('loginError').textContent = err.message;
  }
  $('loginBtn').disabled = false;
};
$('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').onclick = function () { localStorage.removeItem('f27_pin'); pin = ''; me = null; data = null; show('login'); };

// ====== AVAILABILITY LOOKUPS ======
function entriesOn(ds) {
  return data.availability.filter(a => a.startDate <= ds && a.endDate >= ds);
}
function uniqueUsers(entries) {
  const seen = {}; const out = [];
  entries.forEach(e => { if (!seen[e.userId]) { seen[e.userId] = 1; out.push(e.userId); } });
  return out;
}

// ====== RENDERING ======
function renderAll() { renderMonth(); renderDay(); renderWeekends(); }

function renderMonth() {
  $('monthTitle').textContent = MONTHS[month] + ' ' + YEAR;
  $('prevBtn').disabled = month === 0;
  $('nextBtn').disabled = month === 11;
  const first = new Date(YEAR, month, 1);
  const offset = (first.getDay() + 6) % 7; // Monday first
  const daysIn = new Date(YEAR, month + 1, 0).getDate();
  const todayStr = (() => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); })();
  let html = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => '<div class="dow">' + d + '</div>').join('');
  for (let i = 0; i < offset; i++) html += '<div class="day empty"></div>';
  for (let d = 1; d <= daysIn; d++) {
    const ds = ymd(YEAR, month, d);
    const col = (offset + d - 1) % 7;
    const es = entriesOn(ds);
    let counts = '';
    Object.keys(STATUS).forEach(k => {
      const n = uniqueUsers(es.filter(e => e.status === k)).length;
      if (n) counts += '<span>' + STATUS[k].icon + n + '</span>';
    });
    html += '<button class="day' + (col >= 5 ? ' weekend' : '') + (ds === todayStr ? ' today' : '') +
            (ds === selected ? ' selected' : '') + '" data-date="' + ds + '">' +
            '<span class="n">' + d + '</span><span class="counts">' + counts + '</span></button>';
  }
  $('grid').innerHTML = html;
}

function renderDay() {
  $('dayTitle').textContent = fmt(selected, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const es = entriesOn(selected);
  if (!es.length) { $('dayBody').innerHTML = '<p class="muted">Nobody has said anything about this day yet.</p>'; return; }
  let html = '';
  Object.keys(STATUS).forEach(k => {
    const list = es.filter(e => e.status === k);
    if (!list.length) return;
    html += '<div class="group"><h3>' + STATUS[k].icon + ' ' + STATUS[k].label + '</h3>';
    list.forEach(e => {
      const u = userById(e.userId);
      const range = e.startDate === e.endDate ? fmt(e.startDate, { day: 'numeric', month: 'short' })
        : fmt(e.startDate, { day: 'numeric', month: 'short' }) + ' – ' + fmt(e.endDate, { day: 'numeric', month: 'short' });
      html += '<div class="entry"><div>' + chip(u) + '<div class="meta">' + esc(range) + (e.note ? ' · ' + esc(e.note) : '') + '</div></div>' +
              (e.userId === me.id ? '<button class="btn ghost small" data-del="' + esc(e.id) + '">Delete</button>' : '') + '</div>';
    });
    html += '</div>';
  });
  $('dayBody').innerHTML = html;
}

function renderWeekends() {
  const today = new Date();
  let d = new Date(Math.max(today.getTime(), new Date(YEAR, 0, 1).getTime()));
  d = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  while (d.getDay() !== 6) d.setDate(d.getDate() + 1); // next Saturday
  let html = '', shown = 0;
  while (d.getFullYear() === YEAR && shown < 8) {
    const sat = ymd(d.getFullYear(), d.getMonth(), d.getDate());
    const sunD = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    const sun = ymd(sunD.getFullYear(), sunD.getMonth(), sunD.getDate());
    const es = entriesOn(sat).concat(entriesOn(sun));
    let body = '';
    Object.keys(STATUS).forEach(k => {
      const ids = uniqueUsers(es.filter(e => e.status === k));
      if (ids.length) body += '<div>' + STATUS[k].icon + ' ' + ids.map(id => chip(userById(id))).join('') + '</div>';
    });
    if (!body) body = '<div class="muted">No info yet</div>';
    html += '<button class="weekend-row" data-date="' + sat + '"><div class="when">' +
            esc(fmt(sat, { day: 'numeric', month: 'short' }) + ' – ' + fmt(sun, { day: 'numeric', month: 'short' })) +
            '</div>' + body + '</button>';
    shown++;
    d.setDate(d.getDate() + 7);
  }
  $('weekends').innerHTML = html || '<p class="muted">No more weekends in 2027!</p>';
}

// ====== INTERACTIONS ======
function selectDate(ds) {
  selected = ds;
  month = parse(ds).getMonth();
  $('fStart').value = ds;
  renderAll();
}

$('prevBtn').onclick = function () { if (month > 0) { month--; renderMonth(); } };
$('nextBtn').onclick = function () { if (month < 11) { month++; renderMonth(); } };

document.addEventListener('click', async function (e) {
  const dayBtn = e.target.closest('[data-date]');
  if (dayBtn) { selectDate(dayBtn.getAttribute('data-date')); if (dayBtn.classList.contains('weekend-row')) window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const delBtn = e.target.closest('[data-del]');
  if (delBtn) {
    if (!confirm('Delete this entry?')) return;
    delBtn.disabled = true;
    try { const j = await api('deleteAvailability', { id: delBtn.getAttribute('data-del') }); data = j.data; renderAll(); }
    catch (err) { alert(err.message); delBtn.disabled = false; }
  }
});

$('addBtn').onclick = async function () {
  const start = $('fStart').value, end = $('fEnd').value;
  $('formError').textContent = '';
  if (!start) { $('formError').textContent = 'Pick a start date.'; return; }
  if (end && end < start) { $('formError').textContent = 'The end date is before the start date.'; return; }
  $('addBtn').disabled = true; $('addBtn').textContent = 'Saving…';
  try {
    const j = await api('addAvailability', {
      status: $('fStatus').value, startDate: start, endDate: end || start, note: $('fNote').value
    });
    data = j.data;
    $('fNote').value = ''; $('fEnd').value = '';
    selected = start; month = parse(start).getMonth();
    renderAll();
  } catch (err) {
    $('formError').textContent = err.message;
  }
  $('addBtn').disabled = false; $('addBtn').textContent = 'Save';
};

start();
</script>
</body>
</html>
